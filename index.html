<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Work Activity Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Work Activity Tracker</h1>
<div class="card">
<h3>Log Activity</h3>
<div class="grid">
<div><label>Project</label><input id="project"></div>
<div><label>Status</label>
<select id="status">
<option value="In Progress">In Progress</option>
<option value="Pending">Pending</option>
<option value="Done">Done / Complete</option>
<option value="Hold">Hold / Cancelled</option>
</select></div>
<div style="grid-column:1/-1"><label>Date</label><input type="date" id="date"></div>
</div>
<label>Context / Notes</label>
<div class="editor-wrap">
  <div class="toolbar">
    <button type="button" class="tb-btn" onclick="fmt2('bold')" title="Bold"><b>B</b></button>
    <button type="button" class="tb-btn" onclick="fmt2('italic')" title="Italic"><i>I</i></button>
    <button type="button" class="tb-btn" onclick="fmt2('underline')" title="Underline"><u>U</u></button>
    <div class="tb-sep"></div>
    <button type="button" class="tb-btn" onclick="fmt2('insertUnorderedList')" title="Bullet list">• List</button>
    <button type="button" class="tb-btn" onclick="fmt2('insertOrderedList')" title="Numbered list">1. List</button>
    <div class="tb-sep"></div>
    <button type="button" class="tb-btn" onclick="insertLink()" title="Insert link">🔗</button>
    <button type="button" class="tb-btn" onclick="document.getElementById('imgUpload').click()" title="Insert image">🖼 Image</button>
    <input type="file" id="imgUpload" accept="image/*" style="display:none;width:auto;margin:0" onchange="insertImage(event)">
    <div class="tb-sep"></div>
    <button type="button" class="tb-btn" onclick="fmt2('removeFormat')" title="Clear formatting" style="font-size:11px">✕ Clear</button>
  </div>
  <div id="context" class="editor-body" contenteditable="true" data-placeholder="Describe what you did, changes made, requirements, reasons..."></div>
</div>
<br>
<button onclick="saveEntry()" id="saveBtn">Save Activity</button>
</div>
<div class="card">
<h3>Dashboard</h3>
<div id="stats"></div>
</div>
<div class="card">
<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px">
  <h3 style="margin-bottom:0">History</h3>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button onclick="exportXLSX()">📊 Export to Excel (XLSX)</button>
    <button onclick="exportJSON()">💾 Backup JSON</button>
    <button onclick="document.getElementById('importFile').click()">📂 Restore JSON</button>
    <input type="file" id="importFile" accept=".json" style="display:none;width:auto;margin:0" onchange="importJSON(event)">
  </div>
</div>
<table>
<thead>
<tr><th>Project</th><th>Status</th><th>Date</th><th>Context / Notes</th><th>Actions</th></tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div>
<div id="lightbox" onclick="this.classList.remove('show')"><img id="lbImg" src=""></div>
<script src="xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
