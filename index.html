<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Work Activity Tracker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0f1117;
    --surface:  #1a1d27;
    --surface2: #22263a;
    --border:   #2e3248;
    --text:     #e8eaf0;
    --text2:    #8b90a8;
    --text3:    #555a72;
    --accent:   #5b7cf6;
    --accent2:  #1e2a5e;
    --danger:   #e05c5c;
    --success:  #3dba8c;
    --warning:  #e09b3d;
    --radius:   10px;
    --radius-sm: 6px;
  }

  body {
    font-family: Arial, sans-serif;
    max-width: 1100px;
    margin: auto;
    padding: 24px 20px;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 20px;
    color: var(--text);
  }

  h3 {
    font-size: 14px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text2);
    margin-bottom: 14px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 20px;
    border-radius: var(--radius);
    margin-bottom: 14px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text2);
    margin-bottom: 4px;
    margin-top: 12px;
  }

  label:first-child { margin-top: 0; }

  input, select, textarea {
    width: 100%;
    padding: 9px 10px;
    margin-top: 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: Arial, sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent2);
  }

  textarea { resize: vertical; min-height: 72px; line-height: 1.6; }

  select option { background: var(--surface2); color: var(--text); }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  button {
    padding: 9px 16px;
    cursor: pointer;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    transition: all 0.15s;
  }

  button:hover { background: var(--border); }
  button:active { transform: scale(0.97); }

  #saveBtn {
    margin-top: 14px;
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    padding: 10px 20px;
  }

  #saveBtn:hover { opacity: 0.85; background: var(--accent); }

  .badge {
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }

  #stats {
    font-size: 14px;
    color: var(--text2);
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }

  #stats span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 6px 12px;
    color: var(--text);
    font-size: 13px;
  }

  #stats span b { color: var(--accent); }

  table {
    width: 100%;
    border-collapse: collapse;
    background: transparent;
    font-size: 14px;
  }

  th {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text2);
    background: var(--surface2);
  }

  th:first-child { border-radius: var(--radius-sm) 0 0 0; }
  th:last-child  { border-radius: 0 var(--radius-sm) 0 0; }

  td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    vertical-align: middle;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }

  td button {
    padding: 5px 10px;
    font-size: 12px;
    margin-right: 4px;
  }

  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<h1>Work Activity Tracker</h1>
<div class="card">
<h3>Log Activity</h3>
<div class="grid">
<div><label>Project</label><input id="project"></div>
<div><label>Status</label>
<select id="status">
<option value="In Progress">In Progress</option>
<option value="Pending">Pending</option>
<option value="Done">Done / Complete</option>
<option value="Hold">Hold / Cancelled</option>
</select></div>
<div style="grid-column:1/-1"><label>Date</label><input type="date" id="date"></div>
</div>
<label>Context / Notes</label>
<textarea id="context" placeholder="Describe what you did, any changes made, requirements, reasons..."></textarea><br><br>
<button onclick="saveEntry()" id="saveBtn">Save Activity</button>
</div>
<div class="card">
<h3>Dashboard</h3>
<div id="stats"></div>
</div>
<div class="card">
<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px">
  <h3 style="margin-bottom:0">History</h3>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button onclick="exportCSV()">📊 Export to Excel (CSV)</button>
    <button onclick="exportJSON()">💾 Backup JSON</button>
    <button onclick="document.getElementById('importFile').click()">📂 Restore JSON</button>
    <input type="file" id="importFile" accept=".json" style="display:none;width:auto;margin:0" onchange="importJSON(event)">
  </div>
</div>
<table>
<thead>
<tr><th>Project</th><th>Status</th><th>Date</th><th>Context / Notes</th><th>Actions</th></tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div>
<script>
let entries=JSON.parse(localStorage.getItem("tracker_entries")||"[]");
let editId=null;

const STATUS_STYLE={
  "In Progress": "background:#1e2a5e;color:#7fa8f8",
  "Pending":     "background:#2e2a14;color:#e0b84a",
  "Done":        "background:#0d2e24;color:#3dba8c",
  "Hold":        "background:#2e1a1a;color:#e06060"
};

function saveStore(){localStorage.setItem("tracker_entries",JSON.stringify(entries));}

function fmt(iso){
  if(!iso) return "";
  const d=new Date(iso+"T00:00:00");
  return d.toLocaleDateString("en-MY",{day:"2-digit",month:"short",year:"numeric"});
}

function saveEntry(){
  const proj=document.getElementById("project").value.trim();
  const ctx=document.getElementById("context").value.trim();
  if(!proj){alert("Please enter a project name.");return;}
  if(!ctx){alert("Please enter the context / notes.");return;}
  const item={
    id:editId||Date.now(),
    project:proj,
    status:document.getElementById("status").value,
    context:ctx,
    date:document.getElementById("date").value,
    createdAt:new Date().toISOString(),
    updatedAt:new Date().toISOString()
  };
  if(editId){
    const i=entries.findIndex(x=>x.id===editId);
    item.createdAt=entries[i].createdAt;
    entries[i]=item;
  }else{
    entries.unshift(item);
  }
  editId=null;
  document.getElementById("saveBtn").textContent="Save Activity";
  document.getElementById("project").value="";
  document.getElementById("context").value="";
  document.getElementById("status").value="In Progress";
  document.getElementById("date").value=nowLocal();
  saveStore();
  render();
}

function editEntry(id){
  const e=entries.find(x=>x.id===id);
  document.getElementById("project").value=e.project;
  document.getElementById("status").value=e.status;
  document.getElementById("context").value=e.context||e.activity||"";
  document.getElementById("date").value=e.date;
  editId=id;
  document.getElementById("saveBtn").textContent="Update Activity";
  window.scrollTo({top:0,behavior:"smooth"});
}

function delEntry(id){
  if(!confirm("Delete this entry?")) return;
  entries=entries.filter(x=>x.id!==id);
  saveStore();
  render();
}

function render(){
  document.getElementById("rows").innerHTML=entries.map(e=>{
    const st=STATUS_STYLE[e.status]||"background:#22263a;color:#8b90a8";
    return `<tr>
      <td>${esc(e.project)}</td>
      <td><span class="badge" style="${st}">${esc(e.status)}</span></td>
      <td style="white-space:nowrap;font-size:12px;color:#8b90a8">${fmt(e.date)}</td>
      <td>${esc(e.context||e.activity||"")}</td>
      <td style="white-space:nowrap">
        <button onclick="editEntry(${e.id})">✏️ Edit</button>
        <button onclick="delEntry(${e.id})" style="color:#e05c5c">🗑 Del</button>
      </td>
    </tr>`;
  }).join("");
  const inprog=entries.filter(e=>e.status==="In Progress").length;
  const done=entries.filter(e=>e.status==="Done").length;
  const pending=entries.filter(e=>e.status==="Pending").length;
  const hold=entries.filter(e=>e.status==="Hold").length;
  document.getElementById("stats").innerHTML=
    `<span>Total <b>${entries.length}</b></span>`+
    `<span>In Progress <b style="color:#7fa8f8">${inprog}</b></span>`+
    `<span>Pending <b style="color:#e0b84a">${pending}</b></span>`+
    `<span>Done <b style="color:#3dba8c">${done}</b></span>`+
    `<span>Hold/Cancelled <b style="color:#e06060">${hold}</b></span>`;
}

function esc(s){
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function nowLocal(){
  const d=new Date();
  return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}

function dl(content,name,mime){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([content],{type:mime}));
  a.download=name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function exportCSV(){
  if(!entries.length){alert("No entries to export yet.");return;}
  const hdr=["Date","Project","Status","Context / Notes"];
  const rows=entries.map(e=>[e.date,e.project,e.status,e.context||e.activity||""]
    .map(v=>`"${String(v).replace(/"/g,'""')}"`).join(","));
  dl("\ufeff"+[hdr.join(","),...rows].join("\r\n"),"work-activity-log.csv","text/csv;charset=utf-8");
}

function exportJSON(){
  if(!entries.length){alert("No entries to backup yet.");return;}
  dl(JSON.stringify({entries,exported:new Date().toISOString()},null,2),
    "work-activity-backup.json","application/json");
}

function importJSON(ev){
  const f=ev.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=function(e){
    try{
      const d=JSON.parse(e.target.result);
      if(d.entries){entries=d.entries;saveStore();render();alert(`Restored ${entries.length} entries.`);}
      else{alert("Invalid backup file.");}
    }catch(err){alert("Could not read file.");}
  };
  r.readAsText(f);
  ev.target.value="";
}

document.getElementById("date").value=nowLocal();
render();
</script>
</body>
</html>
